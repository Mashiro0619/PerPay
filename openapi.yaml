          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempt_count: { type: integer, minimum: 0 }
        next_attempt_at:
          type: [string, 'null']
          format: date-time
          description: Present only while pending or waiting for retry.
        lease_expires_at:
          type: [string, 'null']
          format: date-time
          description: Present only while an attempt holds the delivery lease.
        acknowledged_at: { type: [string, 'null'], format: date-time }
        dead_lettered_at: { type: [string, 'null'], format: date-time }
        last_error_code:
          type: [string, 'null']
          minLength: 1
