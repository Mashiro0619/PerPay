        requested_amount_cents: { type: integer, minimum: 1, maximum: 9999999998 }
        payable_amount_cents: { type: integer, minimum: 2, maximum: 9999999999 }
        received_amount_cents: { type: integer, minimum: 1, maximum: 9999999999 }
        currency: { const: CNY }
        payment_status:
          type: string
          enum: [UNPAID, CONFIRMED, DISPUTED]
        payment_basis:
          type: string
          enum: [NONE, INFERRED, MANUAL]
        refund_status:
          type: string
          enum: [NONE, PARTIAL, FULL]
        event_details:
          type: object
          additionalProperties: true
        order_version: { type: integer, minimum: 1 }
        occurred_at:
          type: integer
          minimum: 0
          description: Unix epoch milliseconds when the immutable event was committed.
      description: |
        Exact persisted JSON used as the outbound request body. Consumers must use `schema`
        for version dispatch and tolerate additive fields and future event types.
    WebhookAcknowledgement:
      type: object
      additionalProperties: false
      x-perpay-max-utf8-bytes: 16384
