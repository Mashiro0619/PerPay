      properties:
        schema:
          type: string
          pattern: '^perpay:outbox-event:v[1-9][0-9]*$'
        event_id: { $ref: '#/components/schemas/ResourceId' }
        event_type:
          type: string
          description: Current values include PAYMENT_CONFIRMED, PAYMENT_DISPUTED, and REFUND_UPDATED.
        financial_operation_id:
          $ref: '#/components/schemas/ResourceId'
        order_id: { $ref: '#/components/schemas/ResourceId' }
