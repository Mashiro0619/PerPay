        - target_id
        - generation
        - predecessor_delivery_id
        - request_key
        - requested_by_type
        - requested_by_actor_id
        - reason
        - status
        - attempt_count
        - next_attempt_at
        - lease_expires_at
        - acknowledged_at
        - dead_lettered_at
        - last_error_code
        - created_at
        - updated_at
      properties:
        delivery_id: { $ref: '#/components/schemas/ResourceId' }
