          minLength: 1
          maxLength: 500
          x-perpay-max-unicode-characters: 500
          description: Trimmed Unicode text without control characters or isolated surrogates.
    WebhookRedeliveryEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [delivery, replayed]
          properties:
            delivery: { $ref: '#/components/schemas/WebhookDelivery' }
            replayed: { type: boolean }
    Sha256Fingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    BadRequest:
      description: >-
        Malformed or ambiguous request, including an invalid `X-Forwarded-For` chain supplied
        by a configured trusted proxy (`forwarded_header_invalid`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: API authentication failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnauthorized:
      description: >-
        Administrator credentials are invalid, or the session is missing, expired, or revoked
        (`invalid_credentials` or `session_invalid`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminForbidden:
      description: Same-origin or CSRF validation failed (`origin_not_allowed` or `csrf_invalid`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    FinancialWriteForbidden:
      description: >-
        Same-origin or CSRF validation failed, or recent-password verification is not active
        (`origin_not_allowed`, `csrf_invalid`, or `step_up_required`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Order does not exist in the authenticated client scope
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CheckoutNotFound:
      description: Checkout token is invalid or unknown
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Idempotency, merchant order number, or nonce conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    FinancialConflict:
      description: >-
        Financial facts or state changed, the candidate set changed, the cumulative refund
        would exceed the received amount, or the operation identifier was reused with different
        input (`match_state_conflict`, `candidate_set_changed`, or `operation_conflict`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PasswordUnchanged:
      description: The replacement password is identical to the verified current password (`password_unchanged`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReconciliationNotFound:
      description: >-
        The requested candidate, payment association, order, exception, or path resource does
        not exist (`candidate_not_found`, `match_not_found`, `financial_exception_not_found`,
        or `ledger_entry_not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LedgerConflictNotFound:
      description: The requested ledger conflict does not exist (`ledger_conflict_not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LedgerConflictConflict:
      description: >-
        The conflict is already terminal, the requested action is not allowed for its evidence
        type, or the operation identifier was reused with different input
        (`ledger_conflict_state_conflict`, `ledger_conflict_action_not_allowed`, or
        `ledger_conflict_operation_conflict`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooLarge:
      description: Request body exceeds the route limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: JSON endpoint requires application/json
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: Request fields violate the contract
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    OrderValidationFailed:
      description: >-
        Order fields violate the contract, notification delivery is disabled, or `notify_url`
        is invalid or outside the configured allowed origin (`validation_failed`,
        `webhook_disabled`, `webhook_target_invalid`, or `webhook_target_not_allowed`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Public checkout request budget is exhausted
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminRateLimited:
      description: Administrator password attempts are temporarily rate limited.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AdminUnavailable:
      description: Administrator identity is not initialized or password verification capacity is busy.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LedgerUnavailable:
      description: >-
        Ledger conflict storage is unavailable, or administrator password verification capacity
        is busy (`ledger_unavailable` or `password_work_busy`).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ReconciliationUnavailable:
      description: >-
        Reconciliation is unavailable or the persistent financial clock is unsafe
        (`reconciliation_unavailable` or `financial_clock_unavailable`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    WebhookEventNotFound:
      description: >-
        The event identifier is malformed, unknown, or belongs to another API client
        (`event_not_found`). These cases are intentionally indistinguishable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    WebhookDeliveryNotFound:
      description: The delivery identifier is malformed or unknown (`webhook_delivery_not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    WebhookConflict:
      description: >-
        Notification delivery is disabled, the historical target is no longer active, the
        delivery state changed, or a redelivery identifier was reused with different input
        (`webhook_disabled`, `webhook_target_inactive`, `webhook_delivery_state_conflict`,
        or `webhook_operation_conflict`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    WebhookUnavailable:
      description: >-
        Notification storage or its active signing-key state is unavailable
        (`webhook_unavailable`, `webhook_signing_key_unavailable`, or
        `webhook_signing_key_rollback`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: >-
        No amount slot is available, core storage or the order clock is unsafe
        (`system_not_ready`), provider collection has no sufficiently recent successful scan
        (`collection_not_ready`), or automatic reconciliation has no sufficiently recent successful
        run (`reconciliation_not_ready`).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
