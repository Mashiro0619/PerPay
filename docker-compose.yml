# 先填写 app.environment 顶部的首次部署必填项。
name: perpay

x-perpay-backup-interval-seconds: &perpay-backup-interval-seconds "86400"

services:
  app:
    environment:
      # 首次部署必须填写；管理员初始化后删除第一项。
      PERPAY_INITIAL_ADMIN_PASSWORD: "CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD"
      PERPAY_API_SECRET: "CHANGE_ME_TO_A_43_CHARACTER_BASE64URL_SECRET"
      PERPAY_COLLECTION_CODE_PAYLOAD: "CHANGE_ME_TO_COLLECTION_CODE_PAYLOAD"
      PERPAY_ALIPAY_ENABLED: "true"
      PERPAY_ALIPAY_APP_ID: "CHANGE_ME_TO_ALIPAY_APP_ID"
      PERPAY_ALIPAY_PRIVATE_KEY: |-
        -----BEGIN PRIVATE KEY-----
        CHANGE_ME_TO_ALIPAY_APPLICATION_PRIVATE_KEY
        -----END PRIVATE KEY-----
      # 这里填写支付宝平台公钥，不是应用公钥。
      PERPAY_ALIPAY_PUBLIC_KEY: |-
        -----BEGIN PUBLIC KEY-----
        CHANGE_ME_TO_ALIPAY_PLATFORM_PUBLIC_KEY
        -----END PUBLIC KEY-----

      # 按部署环境修改。
      PERPAY_PUBLIC_URL: "http://localhost:8080"
      PERPAY_TRUSTED_PROXY_CIDRS: ""

      # 可选：启用通知后再填写下面两项。
      PERPAY_WEBHOOK_ENABLED: "false"
      PERPAY_WEBHOOK_ALLOWED_ORIGIN: "https://CHANGE_ME_TO_YOUR_WEBHOOK_HOST"
      PERPAY_WEBHOOK_SECRET: "CHANGE_ME_TO_ANOTHER_43_CHARACTER_BASE64URL_SECRET"

      # 默认值通常无需修改。
      PERPAY_ADMIN_USERNAME: "admin"
      PERPAY_API_CLIENT_ID: "default"
      PERPAY_ORDER_TTL_SECONDS: "300"
      PERPAY_AMOUNT_OFFSET_MAX_CENTS: "99"
      PERPAY_CHECKOUT_KEY_ROTATION_DAYS: "90"
      PERPAY_CHECKOUT_TERMINAL_OBSERVATION_SECONDS: "86400"
      PERPAY_BACKUP_INTERVAL_SECONDS: *perpay-backup-interval-seconds
      PERPAY_ALIPAY_ENDPOINT: "https://openapi.alipay.com"
      PERPAY_ALIPAY_TIMEOUT_MILLISECONDS: "8000"
      PERPAY_ALIPAY_SCAN_INTERVAL_SECONDS: "10"
      PERPAY_ALIPAY_MAX_SUCCESS_AGE_SECONDS: "60"
      PERPAY_WEBHOOK_TIMEOUT_MILLISECONDS: "5000"
      PERPAY_WEBHOOK_MAX_ATTEMPTS: "12"
      PERPAY_WEBHOOK_RETRY_BASE_SECONDS: "5"
      PERPAY_WEBHOOK_RETRY_MAX_SECONDS: "3600"
    image: ghcr.io/mashiro0619/perpay:latest
    # 按部署环境修改宿主端口；公网请使用 HTTPS 反向代理。
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - perpay-data:/data
      - perpay-backups:/backups:ro
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: ghcr.io/mashiro0619/perpay:latest
    environment:
      PERPAY_DATA_DIR: "/data"
      PERPAY_BACKUP_DIR: "/backups"
      PERPAY_BACKUP_INTERVAL_SECONDS: *perpay-backup-interval-seconds
      PERPAY_BACKUP_KEEP_COUNT: "7"
    volumes:
      - perpay-data:/data:ro
      - perpay-backups:/backups
    user: "1000:1000"
    command:
      - node
      - dist/backup/runner.js
      - schedule
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    network_mode: none
    healthcheck:
      test:
        - CMD
        - node
        - dist/backup/runner.js
        - health
      interval: 5m
      timeout: 10s
      start_period: 10m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maintenance:
    image: ghcr.io/mashiro0619/perpay:latest
    profiles:
      - maintenance
    environment:
      PERPAY_DATA_DIR: "/data"
      PERPAY_BACKUP_DIR: "/backups"
      PERPAY_BACKUP_INTERVAL_SECONDS: *perpay-backup-interval-seconds
      PERPAY_BACKUP_KEEP_COUNT: "7"
    volumes:
      - perpay-data:/data
      - perpay-backups:/backups
    user: "1000:1000"
    entrypoint:
      - node
      - dist/backup/runner.js
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    network_mode: none

volumes:
  perpay-data:
  perpay-backups:
