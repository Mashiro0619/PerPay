name: perpay

# 按需修改：宿主机 IP:宿主机端口:容器端口；默认仅宿主机可访问。
# 端口冲突时只改中间的 6190，容器端口保持 6190。
x-perpay-host-port: &perpay-host-port "127.0.0.1:6190:6190"
# 必填：替换为你的 HTTPS 访问地址，不带路径。
x-perpay-public-url: &perpay-public-url "https://pay.example.com"
# HTTPS 部署必填：直连反向代理的 IP 或 CIDR 网段，多个用逗号分隔。
# 以 PerPay 容器实际看到的来源为准；宿主机代理可能显示为 Docker 网关 IP。
x-perpay-trusted-proxy-cidrs: &perpay-trusted-proxy-cidrs ""

services:
  app:
    ports:
      - *perpay-host-port
    environment:
      PERPAY_SECRETS_DIR: "/run/perpay-secrets"
      PERPAY_PUBLIC_URL: *perpay-public-url
      PERPAY_TRUSTED_PROXY_CIDRS: *perpay-trusted-proxy-cidrs
    # 可选：固定版本时，将 app、backup、maintenance 三处镜像统一改为同一版本。
    image: ghcr.io/mashiro0619/perpay:latest
    volumes:
      - perpay-data:/data
      - perpay-backups:/backups:ro
      - perpay-secrets:/run/perpay-secrets
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6190/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: ghcr.io/mashiro0619/perpay:latest
    environment:
      PERPAY_DATA_DIR: "/data"
      PERPAY_BACKUP_DIR: "/backups"
    volumes:
      - perpay-data:/data:ro
      - perpay-backups:/backups
    user: "1000:1000"
    command:
      - node
      - dist/backup/runner.js
      - schedule
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    network_mode: none
    healthcheck:
      test:
        - CMD
        - node
        - dist/backup/runner.js
        - health
      interval: 5m
      timeout: 10s
      start_period: 10m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maintenance:
    image: ghcr.io/mashiro0619/perpay:latest
    profiles:
      - maintenance
    environment:
      PERPAY_DATA_DIR: "/data"
      PERPAY_BACKUP_DIR: "/backups"
      PERPAY_SECRETS_DIR: "/run/perpay-secrets"
    volumes:
      - perpay-data:/data
      - perpay-backups:/backups
      - perpay-secrets:/run/perpay-secrets:ro
    user: "1000:1000"
    entrypoint:
      - node
      - dist/backup/runner.js
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    network_mode: none

volumes:
  perpay-data:
  perpay-backups:
  perpay-secrets:
