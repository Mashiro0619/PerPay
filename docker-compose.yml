name: perpay

# 部署配置
x-perpay-master-key: &perpay-master-key "CHANGE_ME_TO_64_HEX_CHARACTERS"
x-perpay-host-port: &perpay-host-port "127.0.0.1:6190:6190"
x-perpay-public-url: &perpay-public-url "http://localhost:6190"
x-perpay-trusted-proxy-cidrs: &perpay-trusted-proxy-cidrs ""

# 自动备份
x-perpay-backup-interval-seconds: &perpay-backup-interval-seconds "86400"
x-perpay-backup-keep-count: &perpay-backup-keep-count "7"

services:
  app:
    ports:
      - *perpay-host-port
    environment:
      PERPAY_MASTER_KEY: *perpay-master-key
      PERPAY_PUBLIC_URL: *perpay-public-url
      PERPAY_TRUSTED_PROXY_CIDRS: *perpay-trusted-proxy-cidrs
      PERPAY_BACKUP_INTERVAL_SECONDS: *perpay-backup-interval-seconds
    image: ghcr.io/mashiro0619/perpay:latest
    volumes:
      - perpay-data:/data
      - perpay-backups:/backups:ro
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:6190/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: ghcr.io/mashiro0619/perpay:latest
    environment:
      PERPAY_DATA_DIR: "/data"
      PERPAY_BACKUP_DIR: "/backups"
      PERPAY_BACKUP_INTERVAL_SECONDS: *perpay-backup-interval-seconds
      PERPAY_BACKUP_KEEP_COUNT: *perpay-backup-keep-count
    volumes:
      - perpay-data:/data:ro
      - perpay-backups:/backups
    user: "1000:1000"
    command:
      - node
      - dist/backup/runner.js
      - schedule
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    network_mode: none
    healthcheck:
      test:
        - CMD
        - node
        - dist/backup/runner.js
        - health
      interval: 5m
      timeout: 10s
      start_period: 10m
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maintenance:
    image: ghcr.io/mashiro0619/perpay:latest
    profiles:
      - maintenance
    environment:
      PERPAY_DATA_DIR: "/data"
      PERPAY_BACKUP_DIR: "/backups"
      PERPAY_BACKUP_INTERVAL_SECONDS: *perpay-backup-interval-seconds
      PERPAY_BACKUP_KEEP_COUNT: *perpay-backup-keep-count
    volumes:
      - perpay-data:/data
      - perpay-backups:/backups
    user: "1000:1000"
    entrypoint:
      - node
      - dist/backup/runner.js
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    network_mode: none

volumes:
  perpay-data:
  perpay-backups:
