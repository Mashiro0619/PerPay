name: perpay

services:
  app:
    # 正式发布后替换为带版本与摘要的预构建镜像。
    image: perpay:0.1.0-dev
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 必填：仅在首次初始化数据库时用于创建管理员；至少 12 个字符、最多 1024 UTF-8 字节。
      # 推荐使用无填充 base64url 随机值；若自行填写包含 $ 的密码，Compose 中必须写成 $$。
      PERPAY_INITIAL_ADMIN_PASSWORD: "CHANGE_ME_TO_A_LONG_RANDOM_PASSWORD"
      PERPAY_ADMIN_USERNAME: "admin"
      # 浏览器实际访问的 origin；修改宿主端口时一并修改这里。
      PERPAY_PUBLIC_URL: "http://localhost:8080"
      # 必填：32 个随机字节的无填充 base64url 编码（恰好 43 字符），不得复用初始管理员密码。
      PERPAY_API_CLIENT_ID: "default"
      PERPAY_API_SECRET: "CHANGE_ME_TO_A_43_CHARACTER_BASE64URL_SECRET"
      # 必填：经营码二维码解码后的原始内容。订单会冻结其版本，修改后只影响新订单。
      PERPAY_COLLECTION_CODE_PAYLOAD: "CHANGE_ME_TO_COLLECTION_CODE_PAYLOAD"
      # 订单有效期 60-1800 秒；尾差范围 1-99 分，新订单从 +0.01 元开始分配唯一应付金额。
      PERPAY_ORDER_TTL_SECONDS: "300"
      PERPAY_AMOUNT_OFFSET_MAX_CENTS: "99"
    ports:
      # 默认仅本机可访问；修改中间端口，公网访问应由 HTTPS 反向代理提供。
      - "127.0.0.1:8080:8080"
    volumes:
      - perpay-data:/data
    user: "1000:1000"
    # 正式版本默认保活；调试确定性配置错误时用 `docker compose logs app` 查看原因。
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  perpay-data:
